# Foyer, the household's own server, and its data in a volume of its own.
#
#   cp .env.example .env
#   docker compose up -d
#   docker compose exec foyer foyer superuser upsert you@example.com 'a long password'

# Named, so its volume is foyer_pb_data wherever this folder is checked out.
name: foyer

services:
  foyer:
    build: .
    image: foyer
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    ports:
      # 127.0.0.1:8090:8090 when a reverse proxy on this host is the way in.
      - "${FOYER_PUBLISH:-8090}:8090"
    volumes:
      # A local volume: SQLite's locking is not safe on NFS or SMB.
      - pb_data:/pb_data
    stop_grace_period: 20s

volumes:
  pb_data:
